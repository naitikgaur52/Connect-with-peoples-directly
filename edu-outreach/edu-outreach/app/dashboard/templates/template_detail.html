{% extends "base.html" %}
{% block content %}
<h3>Edit Template: {{ template.name }}</h3>
<form method="post">
  <div class="mb-2"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ template.name }}" required></div>
  <div class="mb-2"><label class="form-label">Subject</label><input class="form-control" name="subject" value="{{ template.subject }}" required></div>
  <div class="mb-2"><label class="form-label">Body</label><textarea class="form-control" name="body" rows="12" required>{{ template.body }}</textarea></div>
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" name="active" id="active" {{ 'checked' if template.active else '' }}>
    <label class="form-check-label" for="active">Active (available for automated sending)</label>
  </div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
